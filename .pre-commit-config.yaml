# https://docs.gitguardian.com/ggshield-docs/integrations/git-hooks/pre-commit
minimum_pre_commit_version: '3.2.0'

repos:
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.50.3
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: eslint
        name: eslint (eslint-comments hygiene)
        entry: yarn exec eslint
        language: system
        pass_filenames: true
        files: \.js$
        exclude: ^(\.yarn/|dist/|node_modules/|coverage/|playwright-report/|test-results/)
      - id: stylelint
        name: stylelint
        entry: node_modules/.bin/stylelint
        language: system
        args: [--fix]
        files: ^src/styles/.*\.scss$
        stages: [pre-commit]
