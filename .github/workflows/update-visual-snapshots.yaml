name: Update Visual Snapshots

# Regenerates Linux baselines (`*-linux.png`) for the Playwright visual
# regression suite and commits them back to the PR branch.
#
# Trigger: apply the `update-visual-snapshots` label to a PR. The workflow
# runs `yarn test:visual --update-snapshots`, which creates/refreshes any
# `*-linux.png` file whose pixels changed, then commits the diff.
#
# Why: macOS and Linux rasterize fonts differently, so baselines are split
# per-platform (`{platform}` suffix in `snapshotPathTemplate`). Developers
# regenerate `-darwin.png` locally with `yarn test:visual:update`; this
# workflow is the equivalent for `-linux.png`.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  update-snapshots:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'update-visual-snapshots')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository:
            ${{ github.event.pull_request.head.repo.full_name ||
            github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain (Node, Yarn, Playwright Chromium)
        uses: ./.github/actions/setup-yarn-playwright

      - name: regenerate Linux baselines
        run: yarn test:visual --update-snapshots

      - name: commit updated baselines
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # No [skip ci]: if this is PR HEAD, GitHub would skip CI and the PR
          # would never get a fresh visual/build run on the baseline commit.
          commit_message: 'chore(visual): update Linux Playwright baselines'
          # Must be one line: git-auto-commit splits file_pattern with read <<< "",
          # which only consumes the first line — a second path on a new line was ignored
          # (width-pass *-linux.png never got committed).
          file_pattern: tests/visual/home-snapshots/*-linux.png tests/visual/width-snapshots/*-linux.png
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: remove label
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'update-visual-snapshots',
            });
