name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            visual:
              - 'src/styles/**'
              - 'src/pages/**'
              - 'src/data/**'
              - 'src/scripts/**'
              - 'src/assets/**'
              - 'eleventy.config.js'
              - '404.html'
              - '500.html'
              - 'tests/visual/**'
              - 'playwright.config.js'
              - 'scripts/import-aliases-hooks.js'
              - 'scripts/run-with-import-aliases.js'
              - 'jsconfig.json'
              - 'vitest.config.js'
              - 'stylelint.config.js'
              - 'eslint.config.js'
              - 'tests/a11y/**'
              - 'tests/e2e/**'

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Visual baseline parity
        run: bash .github/scripts/check-visual-baseline-parity.sh

      - name: Setup toolchain (Node, Yarn, Playwright Chromium)
        uses: ./.github/actions/setup-yarn-playwright

      - name: ESLint
        run: yarn lint

      - name: Stylelint
        run: yarn lint:styles

      - name: Build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REQUIRE_GOOGLE_MAPS_API_KEY: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: yarn build

      - name: Unit tests
        run: yarn test:unit

      - name: Accessibility tests
        run: yarn test:a11y

      - name: E2E tests
        run: yarn test:e2e

      - name: Upload site dist (pull requests — visual job)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/
          retention-days: 1
          compression-level: 9

      - name: Upload site dist (deploy)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist/

  visual:
    needs: [changes, build]
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.visual == 'true' ||
       contains(join(github.event.pull_request.labels.*.name, ','), 'run-visual'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Setup toolchain (Node, Yarn, Playwright Chromium)
        uses: ./.github/actions/setup-yarn-playwright

      - name: Visual regression tests
        env:
          PLAYWRIGHT_PREBUILT_DIST: '1'
        run: yarn test:visual

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download site dist
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run deploy script
        run: ./deploy.sh
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          LOCAL_PATH: ${{ secrets.LOCAL_PATH }}
