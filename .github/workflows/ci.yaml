name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: install dependencies
              run: |
                  yarn set version 4.0.2
                  yarn install --immutable

            - name: build app
              run: yarn build
